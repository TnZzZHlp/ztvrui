name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      DIST_DIR: ztvrui-${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build
          rm -rf ../backend/dist
          cp -r dist ../backend/

      - name: Build backend
        run: cargo build --release --manifest-path backend/Cargo.toml --target ${{ matrix.target }}

      - name: Prepare package
        run: |
          mkdir "$DIST_DIR"
          cp LICENSE "$DIST_DIR"
          cp example.config.json "$DIST_DIR"
          {
            echo "Version: ${{ github.ref_name }}"
            echo "Build date: $(date)"
            echo "Commit: $(git rev-parse HEAD)"
          } > "$DIST_DIR/version"

      - name: Publish archive
        env:
          ARCHIVE_FILE: ztvrui-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
        run: |
          cp backend/target/${{ matrix.target }}/release/backend "$DIST_DIR/ztvrui"
          tar -zcvf "$ARCHIVE_FILE" "$DIST_DIR"
          shasum -a256 "$ARCHIVE_FILE" > "$ARCHIVE_FILE-sha256sum.txt"
          echo "archive_file=$ARCHIVE_FILE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ztvrui-${{ matrix.target }}-${{ github.ref_name }}
          retention-days: 30
          path: ${{ env.archive_file }}

      - name: Publish release
        uses: softprops/action-gh-release@v2.0.6
        if: ${{ startsWith(github.ref_name, 'v') }}
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.archive_file }}
            ${{ env.archive_file }}-sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
