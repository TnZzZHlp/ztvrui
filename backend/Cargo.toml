[package]
edition = "2021"
name = "backend"
version = "0.3.3"

[dependencies]
# Web framework
axum = "0.8.6"
tower-http = { version = "0.6.6", features = ["trace"] }

# Async runtime
tokio = { version = "1.43.1", features = ["fs", "macros", "net", "rt-multi-thread", "sync"] }

# Serialization
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"

# HTTP client
reqwest = "0.12.8"

# Authentication & Security
bcrypt = "0.17.0"
chrono = "0.4"
jsonwebtoken = "9.3"
# Configuration & CLI
clap = { version = "4.5.23", features = ["derive"] }

# Static files
include_dir = "0.7.4"
mime_guess = "2.0.5"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["chrono", "fmt"] }

# Error handling
thiserror = "2.0.16"

# State management
arc-swap = "1.7"
